name: Native Build

on:
  push:
    branches: [ "develop", "main", "sprint*", "release*" ]
  pull_request:
    branches: [ "develop", "main", "sprint*", "release*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: ./cov_build.sh
